# SEVASA Contable en contenedores — portabilidad a VPS o servidor propio.
#
#   cd docker && cp .env.ejemplo .env   (llenar valores)
#   docker compose up -d --build
#   → el sistema queda en http://localhost (front) con /api proxy al backend
#
# IMPORTANTE — la base de datos:
# El login vive en Supabase Auth (auth.users, extensions.crypt): un Postgres
# "pelado" NO alcanza para producción. La base debe ser:
#   a) Supabase en la nube (lo de hoy): DATABASE_URL apunta al pooler, o
#   b) Supabase SELF-HOSTED en el mismo VPS (github.com/supabase/supabase →
#      docker/) y DATABASE_URL apunta a ese Postgres.
# El servicio "postgres" de abajo (perfil local) es SOLO para restaurar
# respaldos o inspeccionar datos — sin auth no hay inicio de sesión.
services:
  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    env_file: .env
    environment:
      PUERTO: 3001
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: docker/app.Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  # Solo con: docker compose --profile local up postgres
  postgres:
    profiles: ["local"]
    image: postgres:16
    environment:
      POSTGRES_DB: sevasa_contable
      POSTGRES_USER: sevasa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sevasa_local}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
