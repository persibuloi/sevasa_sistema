# SPA + proxy del API al backend (mismo contrato que el proxy de Vite y vercel.json)
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # el API viaja al contenedor del backend
  location /api/ {
    proxy_pass http://backend:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 10m;   # la apertura sube miles de líneas
    proxy_read_timeout 120s;
  }

  # SPA: cualquier ruta cae en index.html (react-router resuelve)
  location / {
    try_files $uri /index.html;
  }
}
